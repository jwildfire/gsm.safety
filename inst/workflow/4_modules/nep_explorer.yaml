meta:
  Type: Report
  ID: nep_explorer
  Output: html
  Name: Nephrotoxicity Explorer Report
  Description: Interactive safety.viz KDIGO nephrotoxicity explorer with acute-kidney-injury stage zones and stage summary table.
  lSettings:
    filters:
      - value_col: ARM
        label: Treatment Group
      - value_col: SEX
        label: Sex
      - value_col: RACE
        label: Race
spec:
  dfResults:
    USUBJID:
      type: character
    TEST:
      type: character
    STRESN:
      type: numeric
    STRESU:
      type: character
steps:
  - output: strOutputDir
    name: getwd
  - output: lWidget
    name: gsm.safety::Widget_NepExplorer
    params:
      dfResults: dfResults
      lSettings: lSettings
  - output: strReportPath
    name: gsm.safety::SaveWidgetReport
    params:
      widget: lWidget
      strOutputDir: strOutputDir
      strOutputFile: ID
