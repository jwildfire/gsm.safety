<!-- Shared chrome for the standalone example pages (#43).

     gsm.utils::build_assets() renders each Example_*.Rmd with rmarkdown and
     drops the HTML into pkgdown/assets/examples/, so these pages land on the
     site outside pkgdown's template with no navbar, no footer, and no styling
     beyond rmarkdown's Bootstrap default. This file supplies all three, pulled
     in by every page as `includes: before_body:` — which pandoc places above
     rmarkdown's own title block, so the band reads as a site header rather than
     as page content.

     Files under util/ are never rendered as pages of their own: build_assets()
     globs *.Rmd non-recursively in the menu directory.

     The palette is the jwildfire.github.io theme the obot hub and the pkgdown
     pages of this site wear (obot.roadmap site/assets/obot-keynote.css, retoned
     2026-09-12): paper ground, graphite ink, plum links, and the seven-hue
     honeycomb strip along the band's top edge, in Instrument Serif, Instrument
     Sans and IBM Plex Mono. The tokens keep their --gs-* names so the rules
     below read as they did; only their values moved. Orange #f97316 is the
     R/Pharma keynote's colour and is not an accent here. The document body
     keeps rmarkdown's structure; the ground, the type and the page furniture
     are themed. -->

<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --gs-band: #f3f4f1;
  --gs-band-ink: #1f2328;
  --gs-band-soft: #5b6470;
  --gs-accent: #6c3270;
  --gs-accent-bright: #522456;   /* the hover is the deeper plum */
  --gs-accent-soft: rgb(108 50 112 / 12%);
  --gs-paper: #fafaf8;
  --gs-ink: #1f2328;
  --gs-muted: #5b6470;
  --gs-faint: #5b6470;           /* meta text stays readable: the lighter #98a0aa fails AA */
  --gs-rule: #e4e6e3;
  --gs-panel: #f3f4f1;
  --gs-serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  --gs-sans: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gs-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Spectrum: equal lightness and chroma (oklch 0.68 / 0.12), hue steps of ~50°. */
  --spec-gradient: linear-gradient(90deg, #d87972, #c78a3b, #77a95b, #00afa9, #519fdd, #988bdd, #c67bb6);

  /* Honeycomb outline tile, used as a mask so a colour shows through the strokes. */
  --hex-mask: url("data:image/svg+xml;utf8,%3Csvg xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' width%3D'5.543' height%3D'9.600' viewBox%3D'0 0 5.543 9.600'%3E%3Cg fill%3D'none' stroke%3D'%23000' stroke-width%3D'0.9'%3E%3Cpolygon points%3D'2.77%2C0.00 5.54%2C1.60 5.54%2C4.80 2.77%2C6.40 -0.00%2C4.80 0.00%2C1.60'%2F%3E%3Cpolygon points%3D'0.00%2C4.80 2.77%2C6.40 2.77%2C9.60 0.00%2C11.20 -2.77%2C9.60 -2.77%2C6.40'%2F%3E%3Cpolygon points%3D'5.54%2C4.80 8.31%2C6.40 8.31%2C9.60 5.54%2C11.20 2.77%2C9.60 2.77%2C6.40'%2F%3E%3Cpolygon points%3D'2.77%2C9.60 5.54%2C11.20 5.54%2C14.40 2.77%2C16.00 -0.00%2C14.40 0.00%2C11.20'%2F%3E%3Cpolygon points%3D'0.00%2C-4.80 2.77%2C-3.20 2.77%2C-0.00 0.00%2C1.60 -2.77%2C-0.00 -2.77%2C-3.20'%2F%3E%3Cpolygon points%3D'5.54%2C-4.80 8.31%2C-3.20 8.31%2C-0.00 5.54%2C1.60 2.77%2C-0.00 2.77%2C-3.20'%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
}

/* ---- Ground and type ------------------------------------------------------
   rmarkdown's Bootstrap 3 default is white Helvetica; the page takes the family's
   paper, ink and three faces so it reads as one site with the pkgdown pages. */

body {
  background: var(--gs-paper);
  color: var(--gs-ink);
  font-family: var(--gs-sans);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--gs-serif);
  font-weight: 400;
  letter-spacing: -0.01em;
}

/* The chart keeps its own typography: a heading inside a widget is the module's. */
div.html-widget :is(h1, h2, h3, h4, h5, h6) {
  font-family: revert;
  font-weight: revert;
  letter-spacing: revert;
}

a {
  color: var(--gs-accent);
}

a:hover,
a:focus {
  color: var(--gs-accent-bright);
  text-decoration: underline;
  text-underline-offset: 0.2em;
}

code,
pre {
  font-family: var(--gs-mono);
  color: var(--gs-ink);
  background: var(--gs-panel);
  border: 1px solid var(--gs-rule);
  border-radius: 6px;
}

pre code {
  border: 0;
  background: none;
}

/* The charts want room; the prose does not. */
.main-container {
  max-width: min(1700px, 96vw) !important;
}

div.html-widget {
  width: 100% !important;
  height: auto !important;
  min-height: 480px;
}

/* ---- Header band --------------------------------------------------------
   Breaks out of the centred .main-container to span the viewport. Negative
   auto-width margins rather than `width: 100vw`, which overflows by the width
   of the vertical scrollbar. The honeycomb strip along its top edge is a
   pseudo-element, so the text on the band is unaffected. */

.gs-band {
  position: relative;
  background: var(--gs-band);
  border-bottom: 1px solid var(--gs-rule);
  margin: 0 calc(50% - 50vw) 1.9rem;
}

.gs-band::before {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 9px;
  opacity: 0.9;
  background: var(--spec-gradient);
  -webkit-mask-image: var(--hex-mask);
  mask-image: var(--hex-mask);
  -webkit-mask-repeat: repeat;
  mask-repeat: repeat;
  -webkit-mask-size: auto 9.6px;
  mask-size: auto 9.6px;
  -webkit-mask-position: left top;
  mask-position: left top;
}

.gs-band-inner {
  max-width: min(1700px, 96vw);
  margin: 0 auto;
  padding: calc(0.9rem + 9px) 15px 1rem;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.35rem 1.5rem;
}

a.gs-brand,
a.gs-brand:focus {
  font-family: var(--gs-serif);
  font-size: 1.4rem;
  color: var(--gs-band-ink);
  text-decoration: none;
}

a.gs-brand:hover {
  color: var(--gs-accent);
  text-decoration: none;
}

.gs-brand-tag {
  font: 500 0.7rem/1.5 var(--gs-mono);
  color: var(--gs-band-soft);
  border: 1px solid var(--gs-rule);
  border-radius: 999px;
  padding: 0.05rem 0.6rem;
  margin-left: 0.55rem;
  vertical-align: 0.12rem;
}

.gs-band-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem 1.2rem;
}

.gs-band-nav a,
.gs-band-nav a:focus {
  font: 0.84rem/1.6 var(--gs-mono);
  color: var(--gs-band-soft);
  text-decoration: none;
}

.gs-band-nav a:hover {
  color: var(--gs-accent);
  text-decoration: none;
}

/* ---- Title block --------------------------------------------------------- */

#header h1.title {
  font-family: var(--gs-serif);
  font-size: 2.7rem;
  font-weight: 400;
  line-height: 1.15;
  letter-spacing: -0.01em;
  margin: 0 0 0.5rem;
}

#header {
  margin-bottom: 0.4rem;
}

.gs-lede {
  font-size: 1.1rem;
  line-height: 1.55;
  color: var(--gs-muted);
  max-width: 60rem;
  margin: 0 0 0.6rem;
}

.gs-meta {
  font: 0.75rem/1.5 var(--gs-mono);
  color: var(--gs-faint);
  margin: 0 0 0.9rem;
}

/* ---- Chip strip: every example, current one marked ----------------------- */

.gs-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem 0.4rem;
  border-top: 1px solid var(--gs-rule);
  padding-top: 0.9rem;
  margin: 0 0 2rem;
}

.gs-chips a,
.gs-chips a:focus {
  font: 0.78rem/1 var(--gs-mono);
  color: var(--gs-muted);
  background: #fff;
  border: 1px solid var(--gs-rule);
  border-radius: 999px;
  padding: 0.33rem 0.72rem;
  text-decoration: none;
  white-space: nowrap;
}

.gs-chips a:hover {
  color: var(--gs-accent);
  border-color: var(--gs-accent);
  background: var(--gs-accent-soft);
  text-decoration: none;
}

.gs-chips a[aria-current='page'],
.gs-chips a[aria-current='page']:hover {
  background: var(--gs-accent);
  border-color: var(--gs-accent);
  color: #fff;
}

/* ---- Workflow disclosure ------------------------------------------------- */

.gs-workflow {
  border: 1px solid var(--gs-rule);
  border-radius: 8px;
  background: #fff;
  margin: 1.2rem 0 1.8rem;
}

.gs-workflow > summary {
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.6rem 0.9rem;
  font: 0.88rem/1.4 var(--gs-mono);
  color: var(--gs-muted);
  list-style: none;
}

.gs-workflow > summary::-webkit-details-marker {
  display: none;
}

.gs-workflow > summary::before {
  content: '\25B8';
  color: var(--gs-accent);
}

.gs-workflow[open] > summary::before {
  content: '\25BE';
}

.gs-workflow[open] > summary {
  border-bottom: 1px solid var(--gs-rule);
}

.gs-workflow > summary:hover {
  color: var(--gs-accent);
}

.gs-workflow pre {
  margin: 0;
  border: 0;
  border-radius: 0 0 8px 8px;
  background: var(--gs-panel);
  max-height: 34rem;
  overflow: auto;
}

/* ---- Previous / next pager ----------------------------------------------- */

.gs-pager {
  display: flex;
  justify-content: space-between;
  gap: 1.5rem;
  border-top: 1px solid var(--gs-rule);
  padding-top: 1.3rem;
  margin: 3rem 0 1.5rem;
}

.gs-pager a,
.gs-pager a:hover,
.gs-pager a:focus {
  color: var(--gs-ink);
  text-decoration: none;
  max-width: 48%;
}

.gs-pager-next {
  text-align: right;
  margin-left: auto;
}

.gs-pager-dir {
  display: block;
  font: 0.7rem/1.6 var(--gs-mono);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--gs-faint);
}

.gs-pager-title {
  display: block;
  font-weight: 600;
}

.gs-pager a:hover .gs-pager-title {
  color: var(--gs-accent);
  text-decoration: underline;
}
</style>

<div class="gs-band">
  <div class="gs-band-inner">

    <nav class="gs-band-nav" aria-label="Site">
      <a href="../index.html">Package home</a>
      <a href="../reference/index.html">Reference</a>
      <a href="https://jwildfire.github.io/safety.viz/">safety.viz charts</a>
      <a href="https://github.com/jwildfire/gsm.safety">GitHub</a>
    </nav>
  </div>
</div>
