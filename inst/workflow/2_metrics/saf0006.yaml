# The stated fix, not a port. SafetyCensus() counts a treatment-arm column
# that no standard domain carries, so the figure comes out blank on any study
# but the demo. The randomisation domain records *that* a participant was
# randomised without recording to what, so the count stops depending on a
# column a blinded safety view should not read anyway. gsm.mapping's own
# mapping already drops screen failures.
meta:
  Type: Analysis
  ID: saf0006
  # D0023.4 - study level ships first, and the level is a setting from the
  # first line rather than a later refactor: moving this metric to site level
  # is GroupLevel: Site plus GroupCol: invid, and nothing else.
  GroupLevel: Study
  GroupCol: studyid
  Abbreviation: RAND
  Metric: Randomised Participants (Study)
  Numerator: Randomised Participant
  Denominator: Enrolled Participant
  Model: Identity
  Score: Numerator
  AnalysisType: identity
  # The mapped domain this metric counts from, named in the error a reader has
  # to act on when a declared column is gone.
  Domain: Mapped_Randomization
  # D0023.3 - no census number raises anything. There is deliberately no
  # Threshold, no Flag and no RiskScoreWeight here, and no gsm.core::Flag step
  # below: gsm.safety::Flag_None stands in that slot and leaves the flag empty,
  # the way gsm.kri's srs0001 risk score already does. An empty flag says this
  # number does not flag; a zero would say measured and found fine. A metric
  # carrying no threshold contributes no weights, so gsm.kri's risk-score
  # builder skips it and this figure cannot move a site's score.
  GenerateRiskSignal: false
spec:
  # D0023 - declaring the columns is what a reader can check the metric
  # against. It is not what stops a missing one reading as zero:
  # gsm.core::CheckSpec() errors on a missing data.frame but only *warns* on a
  # missing column, so gsm.safety::Input_Participants() checks its own columns
  # and stops. Verified against gsm.core 1.3.1 rather than taken from the
  # design.
  Mapped_Randomization:
    subjid:
      type: character
  Mapped_SUBJ:
    subjid:
      type: character
    studyid:
      type: character
steps:
  - output: Analysis_Input
    name: gsm.safety::Input_Participants
    params:
      dfDomain: Mapped_Randomization
      dfSubjects: Mapped_SUBJ
      strDomainName: Domain
      strGroupCol: GroupCol
      strGroupLevel: GroupLevel
  - output: Analysis_Transformed
    name: gsm.core::Transform_Rate
    params:
      dfInput: Analysis_Input
  - output: Analysis_Analyzed
    name: gsm.core::Analyze_Identity
    params:
      dfTransformed: Analysis_Transformed
      strValueCol: Score
  - output: Analysis_Flagged
    name: gsm.safety::Flag_None
    params:
      dfAnalyzed: Analysis_Analyzed
  - output: Analysis_Summary
    name: gsm.core::Summarize
    params:
      dfFlagged: Analysis_Flagged
  - output: lAnalysis
    name: list
    params:
      ID: ID
      Analysis_Input: Analysis_Input
      Analysis_Transformed: Analysis_Transformed
      Analysis_Analyzed: Analysis_Analyzed
      Analysis_Flagged: Analysis_Flagged
      Analysis_Summary: Analysis_Summary
