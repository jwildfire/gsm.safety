meta:
  Type: Report
  ID: hep_waterfall
  Output: html
  Name: Hepatic ALT Waterfall Report
  Description: Interactive safety.viz modified ALT waterfall for abnormal-baseline trials (Amirzadegan et al. 2025, Figure 5).
  lSettings:
    studyday_col: DY
    visit_col: VISIT
    visitn_col: VISITNUM
    baseline_col: ABLFL
    measure_values:
      ALT: Alanine Aminotransferase
      AST: Aspartate Aminotransferase
      TB: Bilirubin
      ALP: Alkaline Phosphatase
    arm_col: ARM
    placebo_arm: 'ABL: Placebo'
    active_arms:
      - 'ABL: Study Drug'
    filters:
      - value_col: SEX
        label: Sex
      - value_col: RACE
        label: Race
spec:
  dfResults:
    USUBJID:
      type: character
    TEST:
      type: character
    STRESN:
      type: numeric
    STNRHI:
      type: numeric
    DY:
      type: numeric
    ABLFL:
      type: character
steps:
  - output: strOutputDir
    name: getwd
  - output: lWidget
    name: gsm.safety::Widget_HepWaterfall
    params:
      dfResults: dfResults
      lSettings: lSettings
  - output: strReportPath
    name: gsm.safety::SaveWidgetReport
    params:
      widget: lWidget
      strOutputDir: strOutputDir
      strOutputFile: ID
