url: https://jwildfire.github.io/gsm.safety

template:
  bootstrap: 5

navbar:
  structure:
    left: [reference, articles]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      aria-label: GitHub
      href: https://github.com/jwildfire/gsm.safety

reference:
  - title: Safety widgets
    desc: Interactive safety.viz charts as htmlwidgets.
    contents:
      - Widget_Histogram
      - Widget_ShiftPlot
      - Widget_DeltaDelta
      - Widget_ResultsOverTime
      - Widget_OutlierExplorer
      - Widget_AeTimelines
      - Widget_AeExplorer
      - Widget_HepExplorer
      - Widget_QtExplorer
  - title: Data
    contents:
      - ExampleData
  - title: Metric steps
    desc: >
      The steps behind the metric definitions in inst/workflow/2_metrics/:
      each turns a domain into the participant-level tier that its flagging
      metric counts.
    contents:
      - Input_HysLaw
      - Input_QtProlongation
      - Input_SafetyAE
  - title: Study census
    desc: The safety overview's denominators, exposure and data coverage.
    contents:
      - SafetyCensus
  - title: Reports
    contents:
      - SaveWidgetReport
